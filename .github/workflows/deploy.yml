name: Deploy to GitHub Pages

# Auto-deploys the console on every push to main.
#  - config.js is NOT tracked in git (see .gitignore); this workflow writes it
#    from the repo Secrets SUPABASE_URL / SUPABASE_ANON_KEY so the page connects.
#  - Every `?v=…` cache-bust query string in *.js / index.html is stamped with the
#    commit's short SHA here. Source files carry `?v=__V__`; never hand-bump them.
#    (Literal numbers are rewritten too, so an older-style bump still deploys
#    consistently.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax gate (every module must parse)
        run: |
          for f in *.js; do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Stamp module versions with the commit SHA
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s/\?v=(__V__|[0-9]+)/?v=${V}/g" *.js index.html
          grep -q "app.js?v=${V}" index.html || { echo "::error::index.html not stamped"; exit 1; }
          grep -q "ui.js?v=${V}" app.js      || { echo "::error::app.js imports not stamped"; exit 1; }
          if grep -rqE '\?v=(__V__|[0-9]+)' *.js index.html; then echo "::error::unstamped ?v= remains"; exit 1; fi
          echo "stamped ?v=${V}"

      - name: Write config.js from secrets
        run: |
          cat > config.js <<EOF
          window.CA_CONFIG = {
            SUPABASE_URL: "${{ secrets.SUPABASE_URL }}",
            SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}",
          };
          EOF
          echo "Wrote config.js (URL present: ${{ secrets.SUPABASE_URL != '' }})"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub's Pages deploy API occasionally returns a transient 401 — retry once.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
